name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.p12
          cat > android/key.properties << 'EOF'
          storeFile=../../upload-keystore.p12
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build release APK (arm64, signed)
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "versionCode=$COMMIT_COUNT"
          flutter build apk --release --dart-define=versionCode=$COMMIT_COUNT -PversionCode=$COMMIT_COUNT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-discipline-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
